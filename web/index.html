<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hockey Night</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Barlow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <header id="top">
      <div class="brand"><i class="live-dot"></i><span>HOCKEY</span><em>NIGHT</em><small id="demo-flag"></small></div>
      <nav id="tabs"></nav>
      <div id="clock"></div>
    </header>

    <main id="main">
      <section id="scene-wrap"><div id="progress"><i></i></div><div id="scene"></div></section>
      <aside id="side">
        <div class="card" id="reels-card">
          <div class="card-h"><b>GOAL REELS</b><span><button id="mute-btn" type="button">SOUND ON</button> <span id="reel-count"></span></span></div>
          <div id="reels-box"></div>
        </div>
        <div class="card" id="club-card"></div>
      </aside>
    </main>

    <div id="tickers">
      <div class="trow news"><div class="tk-label sm"><span>NEWS</span></div><div class="tk-view"><div class="tk-track" id="news-track"></div></div></div>
      <div class="trow up"><div class="tk-label sm alt"><span>GOALS</span></div><div class="tk-view"><div class="tk-track" id="goal-track"></div></div></div>
      <footer id="ticker"><div class="tk-label"><span>SCORES</span></div><div class="tk-view"><div class="tk-track" id="tk-track"></div></div></footer>
    </div>
    <div id="toast"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
